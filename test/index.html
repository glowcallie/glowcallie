<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 몸이 원하는 회복 루틴 테스트 | GlowCallie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #EEF1EA;
    --card: #FFFFFF;
    --ink: #23291F;
    --ink-soft: #5B6355;
    --rose: #C97B86;
    --rose-soft: #F1DCE0;
    --moss: #7C9473;
    --moss-soft: #DDE6D8;
    --honey: #D6A542;
    --line: rgba(35,41,31,0.10);
    --shadow: 0 20px 50px -20px rgba(35,41,31,0.25);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #F4F6F0 0%, transparent 45%),
      radial-gradient(circle at 85% 92%, #E7ECE1 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Noto Serif KR', serif; }

  .stage{
    width:100%;
    max-width:520px;
    position:relative;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:48px 36px 40px;
    position:relative;
    overflow:hidden;
    animation:cardIn .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---- breathing pulse signature ---- */
  .pulse-wrap{
    position:relative;
    width:132px; height:132px;
    margin:0 auto 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .pulse-ring{
    position:absolute;
    border-radius:50%;
    border:1.5px solid var(--rose);
    opacity:0;
    animation:breathe 6s ease-in-out infinite;
  }
  .pulse-ring.r1{ width:60px; height:60px; animation-delay:0s; }
  .pulse-ring.r2{ width:96px; height:96px; animation-delay:1.2s; border-color:var(--moss); }
  .pulse-ring.r3{ width:132px; height:132px; animation-delay:2.4s; border-color:var(--honey); }
  @keyframes breathe{
    0%{ transform:scale(.6); opacity:0; }
    30%{ opacity:.55; }
    60%{ opacity:.25; }
    100%{ transform:scale(1.15); opacity:0; }
  }
  .pulse-core{
    position:relative;
    width:44px; height:44px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--rose), var(--honey));
    z-index:2;
    box-shadow:0 8px 20px -6px rgba(201,123,134,.6);
  }
  @media (prefers-reduced-motion: reduce){
    .pulse-ring{ animation:none; opacity:.3; }
  }

  /* ---- intro ---- */
  .eyebrow{
    text-align:center;
    font-size:12.5px;
    letter-spacing:.14em;
    color:var(--moss);
    font-weight:600;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  h1.title{
    text-align:center;
    font-size:26px;
    font-weight:700;
    line-height:1.4;
    margin:0 0 14px;
    color:var(--ink);
  }
  .subtitle{
    text-align:center;
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 0 32px;
    padding:0 8px;
  }
  .meta-row{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:30px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .meta-row span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--rose); display:inline-block; }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  .btn-primary{
    width:100%;
    background:var(--ink);
    color:#fff;
    font-size:15.5px;
    font-weight:600;
    padding:16px;
    border-radius:14px;
    transition:transform .15s ease, background .2s ease;
    letter-spacing:.01em;
  }
  .btn-primary:hover{ background:#171C13; transform:translateY(-1px); }
  .btn-primary:active{ transform:translateY(0); }
  .btn-primary:focus-visible{ box-shadow:0 0 0 3px var(--moss-soft); }

  .btn-ghost{
    width:100%;
    background:transparent;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:500;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    margin-top:10px;
    transition:background .2s ease, border-color .2s ease;
  }
  .btn-ghost:hover{ background:var(--moss-soft); border-color:var(--moss); color:var(--ink); }
  .btn-ghost:focus-visible{ box-shadow:0 0 0 3px var(--moss-soft); }

  .btn-shop{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    background:linear-gradient(135deg, var(--rose), var(--honey));
    color:#fff;
    font-size:15.5px;
    font-weight:700;
    padding:16px;
    border-radius:14px;
    text-decoration:none;
    letter-spacing:.01em;
    transition:transform .15s ease, box-shadow .2s ease;
    box-shadow:0 10px 24px -10px rgba(201,123,134,.55);
    margin-bottom:10px;
  }
  .btn-shop:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(201,123,134,.6); }
  .btn-shop:active{ transform:translateY(0); }
  .btn-shop:focus-visible{ box-shadow:0 0 0 3px var(--moss-soft); }
  .btn-shop svg{ flex-shrink:0; }

  /* ---- progress ---- */
  .progress-row{
    display:flex;
    gap:6px;
    margin-bottom:28px;
  }
  .progress-seg{
    flex:1;
    height:4px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-seg i{
    display:block;
    height:100%;
    width:0%;
    background:var(--moss);
    transition:width .4s ease;
  }
  .progress-label{
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
    margin:-18px 0 26px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- question ---- */
  .q-eyebrow{
    font-size:12px;
    color:var(--rose);
    font-weight:700;
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .q-text{
    font-size:19.5px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 26px;
    color:var(--ink);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    text-align:left;
    background:#FBFAF7;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-size:14.5px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    line-height:1.45;
  }
  .opt:hover{ border-color:var(--rose); background:var(--rose-soft); }
  .opt:active{ transform:scale(.99); }
  .opt:focus-visible{ box-shadow:0 0 0 3px var(--moss-soft); }

  /* ---- result ---- */
  .result-icon-wrap{
    width:88px; height:88px;
    margin:0 auto 20px;
    border-radius:50%;
    background:var(--rose-soft);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    z-index:2;
  }
  .result-tag{
    text-align:center;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--moss);
    font-weight:700;
    margin-bottom:8px;
  }
  .result-title{
    text-align:center;
    font-size:25px;
    font-weight:700;
    margin:0 0 6px;
  }
  .result-sub{
    text-align:center;
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 26px;
  }
  .result-block{
    background:#FBFAF7;
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px;
    margin-bottom:14px;
  }
  .result-block h3{
    font-size:13px;
    font-weight:700;
    color:var(--rose);
    margin:0 0 8px;
    letter-spacing:.02em;
  }
  .result-block p{
    font-size:14px;
    color:var(--ink);
    margin:0;
    line-height:1.65;
  }
  .result-block ul{
    margin:0; padding-left:18px;
  }
  .result-block li{
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
  }
  .brand-tag{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:22px;
    letter-spacing:.02em;
  }
  .brand-tag b{ color:var(--rose); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  @media (max-width:480px){
    .card{ padding:38px 22px 32px; border-radius:22px; }
    h1.title{ font-size:22px; }
    .q-text{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">

    <!-- ================= INTRO ================= -->
    <section class="screen active" id="screen-intro">
      <div class="pulse-wrap">
        <div class="pulse-ring r1"></div>
        <div class="pulse-ring r2"></div>

      <a class="btn-shop" id="shopBtn" href="#" target="_blank" rel="noopener sponsored">
        <span id="shopBtnText">추천 아이템 보러가기</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13L13 3M13 3H5M13 3V11" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="btn-primary" onclick="location.reload()">다시 테스트하기</button>
      <button class="btn-ghost" onclick="copyResult()">결과 텍스트 복사하기</button>
      <div style="text-align:center; font-size:11px; color:var(--ink-soft); margin-top:6px;">이 링크를 통해 구매 시 수수료를 지급받을 수 있습니다</div>
      <div class="brand-tag">몸의 신호로 마음을 해석합니다 · <b>@glowcallie</b></div>
    </section>

  </div>
</div>

<script>
/* ============================================================

             C(연결/Connect), G(전환/Grow)
   각 문항 4지선다 → 카테고리 1점씩 부여
   ============================================================ */

      { t:"지침, 완전히 소진된 느낌", c:"R" },
      { t:"외로움, 단절된 느낌", c:"C" },

    ]
  },
  {
    q: "\"아, 회복됐다\" 싶은 순간은 언제인가요?",

      { t:"몸을 움직이고 땀을 흘렸을 때", c:"M" },

];

/* 동점 시 우선순위 (브랜드 5개 루틴 순서 기준) */

};

function buildShopUrl(utmContent){
  return `${SHOP_BASE_URL}?utm_source=quiz&utm_medium=recovery_test&utm_content=${utmContent}`;
}

/* ============================================================
   상태 & 로직
   ============================================================ */
let current = 0;
const scores = { M:0, N:0, R:0, C:0, G:0 };

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function buildProgressBar(){
  const row = document.getElementById("progressRow");
  row.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    seg.innerHTML = `<i id="seg-${i}"></i>`;
    row.appendChild(seg);
  });
}

function updateProgress(){
  for(let i=0;i<QUESTIONS.length;i++){
    document.getElementById(`seg-${i}`).style.width = i < current ? "100%" : "0%";
  }
  document.getElementById("progressLabel").textContent = `${current+1} / ${QUESTIONS.length}`;
}

function renderQuestion(){
  const item = QUESTIONS[current];
  document.getElementById("qEyebrow").textContent = `QUESTION ${String(current+1).padStart(2,"0")}`;
  document.getElementById("qText").textContent = item.q;
  const wrap = document.getElementById("qOptions");
  wrap.innerHTML = "";
  item.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.t;
    btn.onclick = () => selectOption(opt.c);
    wrap.appendChild(btn);
  });
  updateProgress();
}

function selectOption(category){
  scores[category] += 1;
  current += 1;
  if(current >= QUESTIONS.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function startQuiz(){
  buildProgressBar();
  showScreen("screen-quiz");
  renderQuestion();
}

function computeResultKey(){
  let best = PRIORITY[0];
  let bestScore = -1;
  PRIORITY.forEach(key => {
    if(scores[key] > bestScore){
      bestScore = scores[key];
      best = key;
    }
  });
  return best;
}

function showResult(){
  const key = computeResultKey();
  const r = RESULTS[key];
  document.getElementById("resultIconWrap").innerHTML = r.icon;
  document.getElementById("resultTag").textContent = r.tag;
  document.getElementById("resultTitle").textContent = r.title;
  document.getElementById("resultSub").textContent = r.sub;
  document.getElementById("resultWhy").textContent = r.why;
  document.getElementById("resultBrainNote").textContent = r.brain;

  const product = PRODUCT_LINKS[key];
  document.getElementById("shopBtn").href = buildShopUrl(product.utm);
  document.getElementById("shopBtnText").textContent = product.label;

  const ul = document.getElementById("resultRoutine");
  ul.innerHTML = "";
  r.routine.forEach(line => {
    const li = document.createElement("li");
    li.textContent = line;
    ul.appendChild(li);
  });
  window.__lastResult = r;
  showScreen("screen-result");
}

function copyResult(){
  const r = window.__lastResult;
  if(!r) return;
  const text = `[내 몸이 원하는 회복 루틴 테스트]\n\n${r.title}\n${r.sub}\n\n▸ 왜 이 결과가 나왔을까요\n${r.why}\n\n▸ 지금 필요한 회복 루틴\n${r.routine.map(x=>"- "+x).join("\n")}\n\n▸ 편안전활 코멘트\n${r.brain}\n\n@glowcallie`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const original = btn.textContent;
    btn.textContent = "복사 완료!";
    setTimeout(() => btn.textContent = original, 1500);
  });
}
